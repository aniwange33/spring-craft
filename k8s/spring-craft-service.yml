apiVersion: v1
kind: Service
metadata:
  name: spring-craft-service
  namespace: spring-craft-dev
  labels:
    app: spring-craft
    tier: backend
  annotations:
    description: "Service for spring-craft deployment"
spec:
  type: ClusterIP
  selector:
    app: spring-craft
    tier: backend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  # Session affinity (optional - uncomment for sticky sessions)
  # sessionAffinity: ClientIP
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800

